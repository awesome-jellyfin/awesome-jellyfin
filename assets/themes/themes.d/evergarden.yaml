# yaml-language-server: $schema=../schema.json
owners:
  - evergardentheme
name: Evergarden
author: evergardentheme
repo: https://github.com/evergardentheme/jellyfin
description: A cozy, muted palette with one variant for each season.
versions:
  - "10.10"
  - "10.11"
  - "12"
screenshots:
  - https://github.com/evergardentheme/jellyfin/raw/main/assets/summer.webp
  - https://github.com/evergardentheme/jellyfin/raw/main/assets/spring.webp
  - https://github.com/evergardentheme/jellyfin/raw/main/assets/fall.webp
  - https://github.com/evergardentheme/jellyfin/raw/main/assets/winter.webp
variants:
  - id: winter
    name: Winter
    css: |-
      @import url("https://evergardentheme.github.io/jellyfin/evergarden-winter.css");
  - id: spring
    name: Spring
    css: |-
      @import url("https://evergardentheme.github.io/jellyfin/evergarden-spring.css");
  - id: summer
    name: Summer
    css: |-
      @import url("https://evergardentheme.github.io/jellyfin/evergarden-summer.css");
  - id: fall
    name: Fall
    css: |-
      @import url("https://evergardentheme.github.io/jellyfin/evergarden-fall.css");
settings:
  - id: accent
    label: Accent
    description: The swatches show Winter's shades.
    type: select
    display: swatches
    default: green
    options:
      - value: red
        label: Red
        swatch:
          - "#f57f82"
        css: |-
          :root {
            --main-color: var(--red);
          }
      - value: orange
        label: Orange
        swatch:
          - "#f7a182"
        css: |-
          :root {
            --main-color: var(--orange);
          }
      - value: yellow
        label: Yellow
        swatch:
          - "#f5d098"
        css: |-
          :root {
            --main-color: var(--yellow);
          }
      - value: lime
        label: Lime
        swatch:
          - "#dbe6af"
        css: |-
          :root {
            --main-color: var(--lime);
          }
      - value: green
        label: Green
        swatch:
          - "#cbe3b3"
      - value: aqua
        label: Aqua
        swatch:
          - "#b3e3ca"
        css: |-
          :root {
            --main-color: var(--aqua);
          }
      - value: skye
        label: Skye
        swatch:
          - "#b3e6db"
        css: |-
          :root {
            --main-color: var(--skye);
          }
      - value: snow
        label: Snow
        swatch:
          - "#afd9e6"
        css: |-
          :root {
            --main-color: var(--snow);
          }
      - value: blue
        label: Blue
        swatch:
          - "#b2caed"
        css: |-
          :root {
            --main-color: var(--blue);
          }
      - value: purple
        label: Purple
        swatch:
          - "#d2bdf3"
        css: |-
          :root {
            --main-color: var(--purple);
          }
      - value: pink
        label: Pink
        swatch:
          - "#f3c0e5"
        css: |-
          :root {
            --main-color: var(--pink);
          }
      - value: cherry
        label: Cherry
        swatch:
          - "#fae6ef"
        css: |-
          :root {
            --main-color: var(--cherry);
          }
