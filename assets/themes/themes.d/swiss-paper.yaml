# yaml-language-server: $schema=../schema.json
owners:
  - chius-me
name: Swiss Paper
author: chius-me
author_url: https://github.com/chius-me
repo: https://github.com/chius-me/swiss-paper-jellyfin
description: Minimalist warm-paper light monospace theme inspired by Swiss International Typographic Style, featuring 1px hairlines, wavy active navigation underlines, and zero-displacement interactions.
versions:
  - "10.10"
  - "10.11"
  - "12"
screenshots:
  - url: https://raw.githubusercontent.com/chius-me/swiss-paper-jellyfin/main/screenshots/desktop-home.png
    title: Home
    description: Warm paper home view with wavy active navigation underline and segmented toolbar.
  - url: https://raw.githubusercontent.com/chius-me/swiss-paper-jellyfin/main/screenshots/desktop-detail.png
    title: Item Detail
    description: Series detail page with warm-paper backdrop veil, metadata chips, and dashed episode rows.
  - url: https://raw.githubusercontent.com/chius-me/swiss-paper-jellyfin/main/screenshots/desktop-login.png
    title: Sign In
    description: Centered monospace sign-in column with instant dashed focus outline.
variants:
  - id: default
    name: Swiss Paper
    css: |-
      @import url("https://cdn.jsdelivr.net/gh/chius-me/swiss-paper-jellyfin@main/swiss-paper.css");
