# yaml-language-server: $schema=../schema.json
owners:
  - prism2001
name: Finity
author: prism2001
repo: https://github.com/prism2001/finity
description: A modern dark theme in two editions, complete and minimal.
versions:
  - "10.11"
screenshots:
  - https://github.com/prism2001/finity/raw/main/screenshots/home_featured.png
  - https://github.com/prism2001/finity/raw/main/screenshots/home_drawers.png
  - https://github.com/prism2001/finity/raw/main/screenshots/show_season.png
  - https://github.com/prism2001/finity/raw/main/screenshots/movie.png
variants:
  - id: complete
    name: Complete
    css: |-
      @import url("https://cdn.jsdelivr.net/gh/prism2001/finity@main/complete/finity-complete.css");
  - id: minimal
    name: Minimal
    css: |-
      @import url("https://cdn.jsdelivr.net/gh/prism2001/finity@main/minimal/finity-minimal.css");
groups:
  - id: colours
    label: Colours
  - id: tweaks
    label: Tweaks
settings:
  - id: accent
    label: Accent
    type: color
    group: colours
    default: "#00a5dc"
    css: |-
      :root {
        --theme-accent-color: {{ value }};
        --theme-accent-color-alpha-med: {{ value | alpha 0.16 }};
        --theme-accent-color-alpha-high: {{ value | alpha 0.58 }};
        --theme-accent-color-alpha-hover: {{ value | shade 26 }};
      }
  - id: background
    label: Background
    type: color
    group: colours
    default: "#181818"
    var: --theme-background-color
  - id: cards
    label: Cards
    type: color
    group: colours
    default: "#101010"
    var: --card-bg
  - id: roundness
    label: Card corner radius
    type: number
    group: tweaks
    page: home
    default: 15
    min: 0
    max: 30
    step: 1
    unit: px
    var: --theme-roundness-large
  - id: blur
    label: Blur
    type: number
    group: tweaks
    default: 2
    min: 0
    max: 20
    step: 1
    unit: px
    var: --blur-intensity
