author_url: https://github.com/Druidblack
repo: https://github.com/Druidblack/jellyfin-icon-metadata
description: Replaces the text links to metadata providers on item pages, such as IMDb, TMDB, AniList and MusicBrainz, with their logos. Covers about 30 providers for movies, shows, anime, music and books.
status: listed
note: An add-on for the external links on item pages, not a full theme. Add it on top of the stock look or another theme.
