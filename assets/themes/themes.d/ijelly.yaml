# yaml-language-server: $schema=../schema.json
owners:
  - safiyu
name: ijelly
author: safiyu
author_url: https://github.com/safiyu
repo: https://github.com/safiyu/ijelly
description: A collection of six themes for Jellyfin Web (Apple TV, Cinematheque Noir, Editorial, Gallery, Blueprint, and Poster-Tinted).
versions:
  - "12"
recommends:
  backdrops: true
screenshots:
  - https://github.com/safiyu/ijelly/blob/main/screenshots/web/apple-library.jpg?raw=true
  - https://github.com/safiyu/ijelly/blob/main/screenshots/web/noir-library.jpg?raw=true
  - https://github.com/safiyu/ijelly/blob/main/screenshots/web/editorial-library.jpg?raw=true
  - https://github.com/safiyu/ijelly/blob/main/screenshots/web/gallery-library.jpg?raw=true
  - https://github.com/safiyu/ijelly/blob/main/screenshots/web/blueprint-library.jpg?raw=true
  - https://github.com/safiyu/ijelly/blob/main/screenshots/web/tinted-library.jpg?raw=true
variants:
  - id: default
    name: Apple TV
    css: |-
      @import url("https://cdn.jsdelivr.net/gh/safiyu/ijelly@latest/ijelly.css");
  - id: noir
    name: Cinematheque Noir
    css: |-
      @import url("https://cdn.jsdelivr.net/gh/safiyu/ijelly@latest/ijelly_noir.css");
  - id: editorial
    name: Editorial
    css: |-
      @import url("https://cdn.jsdelivr.net/gh/safiyu/ijelly@latest/ijelly_editorial.css");
  - id: gallery
    name: Gallery
    css: |-
      @import url("https://cdn.jsdelivr.net/gh/safiyu/ijelly@latest/ijelly_gallery.css");
  - id: blueprint
    name: Blueprint
    css: |-
      @import url("https://cdn.jsdelivr.net/gh/safiyu/ijelly@latest/ijelly_blueprint.css");
  - id: tinted
    name: Poster-Tinted
    css: |-
      @import url("https://cdn.jsdelivr.net/gh/safiyu/ijelly@latest/ijelly_tinted.css");
groups:
  - id: appearance
    label: Appearance
settings:
  - id: accent-apple
    label: Accent
    type: color
    group: appearance
    variants:
      - default
    default: "#007aff"
    css: |-
      :root {
        --apple-accent: {{ value }};
      }
  - id: accent-noir
    label: Accent
    type: color
    group: appearance
    variants:
      - noir
    default: "#d4a24c"
    css: |-
      :root {
        --noir-accent: {{ value }};
        --noir-accent-dim: {{ value | alpha 0.5 }};
      }
  - id: accent-editorial
    label: Accent
    type: color
    group: appearance
    variants:
      - editorial
    default: "#c8102e"
    css: |-
      :root {
        --ed-accent: {{ value }};
        --ed-accent-dim: {{ value | alpha 0.4 }};
      }
  - id: accent-gallery
    label: Accent
    type: color
    group: appearance
    variants:
      - gallery
    default: "#c9a978"
    css: |-
      :root {
        --gl-accent: {{ value }};
      }
  - id: accent-blueprint
    label: Accent
    type: color
    group: appearance
    variants:
      - blueprint
    default: "#e09030"
    css: |-
      :root {
        --kxta-accent: {{ value }};
        --kxta-accent-soft: {{ value | alpha 0.14 }};
        --kxta-accent-hover: {{ value | shade 16 }};
      }
  - id: accent-tinted
    label: Accent
    type: color
    group: appearance
    variants:
      - tinted
    default: "#ffffff"
    css: |-
      :root {
        --pt-accent: {{ value }};
        --pt-accent-soft: {{ value | alpha 0.15 }};
        --pt-accent-glow: {{ value | alpha 0.3 }};
      }
