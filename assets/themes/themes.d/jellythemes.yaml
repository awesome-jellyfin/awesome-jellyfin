# yaml-language-server: $schema=../schema.json
owners:
  - kingchenc
name: JellyThemes
author: kingchenc
author_url: https://github.com/kingchenc
repo: https://github.com/kingchenc/JellyThemes
description: Six dark themes, each with its own accent on a near-black background, from violet, gold, cyan and orange to gray on pure black and ghostly slate. Glass top bar with blur and glowing cards and buttons. One small file of about 28 KB for every display mode of Jellyfin 12, including TVs.
versions:
  - "10.10"
  - "10.11"
  - "12"
screenshots:
  - https://raw.githubusercontent.com/kingchenc/JellyThemes/main/Themes/Obsidian/assets/preview/Obsidian.png
  - https://raw.githubusercontent.com/kingchenc/JellyThemes/main/Themes/Solaris/assets/preview/Solaris.png
  - url: https://raw.githubusercontent.com/kingchenc/JellyThemes/main/Themes/Obsidian/assets/preview/Obsidian-details.png
    title: Movie page
    hidden: true
  - url: https://raw.githubusercontent.com/kingchenc/JellyThemes/main/Themes/Nebula/assets/preview/Nebula.png
    hidden: true
  - url: https://raw.githubusercontent.com/kingchenc/JellyThemes/main/Themes/Ember/assets/preview/Ember.png
    hidden: true
  - url: https://raw.githubusercontent.com/kingchenc/JellyThemes/main/Themes/Void/assets/preview/Void.png
    hidden: true
  - url: https://raw.githubusercontent.com/kingchenc/JellyThemes/main/Themes/Phantom/assets/preview/Phantom.png
    hidden: true
variants:
  - id: obsidian
    name: Obsidian (violet)
    css: |-
      @import url("https://cdn.jsdelivr.net/gh/kingchenc/JellyThemes@master/Themes/Obsidian/Obsidian.css");
  - id: solaris
    name: Solaris (gold)
    css: |-
      @import url("https://cdn.jsdelivr.net/gh/kingchenc/JellyThemes@master/Themes/Solaris/Solaris.css");
  - id: nebula
    name: Nebula (cyan)
    css: |-
      @import url("https://cdn.jsdelivr.net/gh/kingchenc/JellyThemes@master/Themes/Nebula/Nebula.css");
  - id: ember
    name: Ember (orange)
    css: |-
      @import url("https://cdn.jsdelivr.net/gh/kingchenc/JellyThemes@master/Themes/Ember/Ember.css");
  - id: void
    name: Void (black)
    css: |-
      @import url("https://cdn.jsdelivr.net/gh/kingchenc/JellyThemes@master/Themes/Void/Void.css");
  - id: phantom
    name: Phantom (slate)
    css: |-
      @import url("https://cdn.jsdelivr.net/gh/kingchenc/JellyThemes@master/Themes/Phantom/Phantom.css");
groups:
  - id: effects
    label: Effects
    description: Everything is on by default. On older TVs, turning these off makes the interface faster.
  - id: cards
    label: Cards
  - id: details
    label: Item pages
    description: What shows on the pages of movies and shows.
  - id: mobile
    label: Phones
  - id: login
    label: Login page
  - id: other
    label: Other
settings:
  - id: no-header-blur
    label: No blur under the top bar
    type: toggle
    group: effects
    default: false
    css: |-
      :root {
        --jt-header-backdrop: none;
      }
  - id: no-glow
    label: No glow on cards and buttons
    type: toggle
    group: effects
    default: false
    page: home
    css: |-
      :root {
        --jt-glow: none;
        --jt-glow-s: none;
      }
  - id: no-motion
    label: No animations
    type: toggle
    group: effects
    default: false
    css: |-
      :root {
        --jt-motion: 0s;
        --jt-motion-fast: 0s;
      }
  - id: card-radius
    label: Corner radius
    type: number
    group: cards
    default: 0.6
    min: 0
    max: 1.5
    step: 0.1
    unit: em
    page: home
    var: --jt-card-radius
  - id: hide-card-buttons
    label: Hide the watched and favourite buttons on hover
    type: toggle
    group: cards
    default: false
    page: home
    css: |-
      :root {
        --jt-card-extra-buttons: none;
      }
  - id: hide-library-labels
    label: Hide the labels under library cards
    type: toggle
    group: cards
    default: false
    page: home
    css: |-
      :root {
        --jt-library-labels: none;
      }
  - id: hide-original-title
    label: Hide the original title
    type: toggle
    group: details
    default: false
    page: movie
    css: |-
      :root {
        --jt-original-title: none;
      }
  - id: hide-clear-logo
    label: Hide the logo
    type: toggle
    group: details
    default: false
    page: movie
    css: |-
      :root {
        --jt-detail-logo: none;
      }
  - id: hide-title
    label: Hide the title
    description: The logo still shows the name.
    type: toggle
    group: details
    default: false
    page: movie
    when:
      setting: hide-clear-logo
      is: false
    css: |-
      :root {
        --jt-item-title: none;
      }
  - id: hide-mini-buttons
    label: Hide the small play button on cards
    type: toggle
    group: mobile
    default: false
    css: |-
      :root {
        --jt-card-mini-buttons: none;
      }
  - id: login-text
    label: Heading
    type: text
    group: login
    default: ""
    placeholder: Welcome home
    page: login
    css: |-
      :root {
        --jt-login-text: "{{ value }}";
      }
  - id: login-image
    label: Background image
    type: toggle
    group: login
    default: false
    page: login
    css: |-
      :root {
        --jt-login-bg: url("{{ login-image-url }}");
      }
  - id: login-image-url
    label: Image address
    type: image
    group: login
    when:
      setting: login-image
      is: true
    default: https://raw.githubusercontent.com/kingchenc/JellyThemes/main/Themes/Obsidian/assets/preview/Obsidian.png
    page: login
  - id: hide-footer
    label: Hide the footer
    description: The line with theme name, version and author at the end of each page.
    type: toggle
    group: other
    default: false
    css: |-
      :root {
        --jt-footer: none;
      }
