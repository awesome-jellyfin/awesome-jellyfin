  - https://raw.githubusercontent.com/KartoffelChipss/Jellyfin-Lucide/main/assets/moviepage.webp
  - url: https://raw.githubusercontent.com/KartoffelChipss/Jellyfin-Lucide/main/assets/contextmenu.webp
    hidden: true
