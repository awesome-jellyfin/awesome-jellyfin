name: Check for Stale Entries

on:
  schedule:
    - cron: '13 5 1 * *'
  workflow_dispatch: {}

jobs:
  hit-endpoint:
    runs-on: ubuntu-latest

    concurrency:
      group: stale-url
      cancel-in-progress: false

    steps:
      - name: Run stale checks
        env:
          TARGET_URL: "${{ secrets.STALE_CHECK_URL }}&owner=awesome-jellyfin&repo=awesome-jellyfin&ping=awesome-jellyfin%2Freview"
        run: |
          curl -fL --retry 3 --max-time 180 "$TARGET_URL"
